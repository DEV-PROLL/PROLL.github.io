name: Deploy web app

on:
  push:
    branches:
      - main
      - claude/minecraft-mobile-app-57Pds
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck -w mobile

      - name: Build bridge
        run: npm run bridge:build

      - name: Export web app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPO_PUBLIC_BRIDGE_URL="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/variables/EXPO_PUBLIC_BRIDGE_URL" \
              | node -e 'let d=""; process.stdin.on("data", c => d += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(d).value || ""));'
          )"
          if [ -z "${EXPO_PUBLIC_BRIDGE_URL}" ]; then
            echo "EXPO_PUBLIC_BRIDGE_URL is not configured"
            exit 1
          fi
          echo "::add-mask::${EXPO_PUBLIC_BRIDGE_URL}"
          export EXPO_PUBLIC_BRIDGE_URL
          npm run web:export

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
